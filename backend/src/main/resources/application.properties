# ===================================================================
# GITHUB TIME MACHINE BACKEND CONFIGURATION
# ===================================================================

spring.application.name=github-time-machine-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
server.port=${PORT:8080}
server.servlet.context-path=/

# -------------------------------------------------------------------
# Database Configuration (H2 In-Memory default, PostgreSQL compatible)
# -------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:github_time_machine;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=${DB_POOL_IDLE_TIMEOUT:300000}
spring.datasource.hikari.connection-timeout=${DB_POOL_CONN_TIMEOUT:20000}

# -------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# Actuator Configuration
# -------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# -------------------------------------------------------------------
# OpenAPI / Swagger Configuration
# -------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# -------------------------------------------------------------------
# CORS & Security Environment Resolution
# -------------------------------------------------------------------
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# -------------------------------------------------------------------
# GitHub External API Properties
# -------------------------------------------------------------------
github.api.token=${GITHUB_API_TOKEN:}
github.api.base-url=${GITHUB_API_BASE_URL:https://api.github.com}
github.graphql.url=${GITHUB_GRAPHQL_URL:https://api.github.com/graphql}
github.api.max-retries=${GITHUB_API_MAX_RETRIES:3}

# Logging Configuration
logging.level.root=${LOG_LEVEL_ROOT:INFO}
logging.level.com.githubtimemachine=${LOG_LEVEL_APP:DEBUG}
